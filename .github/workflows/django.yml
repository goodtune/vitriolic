name: Unit Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: dj${{ matrix.django }}-py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: [52, 60, 61]
        python: [311, 312, 313, 314]
        exclude:
          # Django 6.0+ requires Python 3.12+
          - django: 60
            python: 311
          - django: 61
            python: 311

    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Run Tests
        run: uvx tox
        env:
          TOXENV: dj${{ matrix.django }}-py${{ matrix.python }}
