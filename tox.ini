[tox]
envlist =
    dj52-py{311, 312, 313, 314}  # LTS, EOL Apr 2028
    dj60-py{312, 313, 314}  # EOL Apr 2027
    dj61-py{312, 313, 314}  # EOL Dec 2027
    e2e
skip_missing_interpreters = true
requires =
    tox-docker
    tox-uv

[testenv]
package = editable
constrain_package_deps = true
deps =
    dj52: Django~=5.2.0
    dj60: Django~=6.0.0
    dj61: Django~=6.1.0
dependency_groups = test
extras =
    admin
    competition
    content
    news
    ops
changedir = tests
commands =
    coverage run manage.py test --debug-sql --timing {posargs:touchtechnology.common touchtechnology.admin touchtechnology.content touchtechnology.news tournamentcontrol.competition}
docker = db

[testenv:e2e]
basepython = python3.13
deps = Django~=5.2.0
setenv =
    DJANGO_ALLOW_ASYNC_UNSAFE = 1
    OPS_EVENTS_BACKEND = redis
docker =
    db
    redis
commands =
    playwright install --with-deps chromium
    pytest {posargs}

[docker:db]
image = postgres:15-alpine
environment =
    POSTGRES_USER=vitriolic
    POSTGRES_PASSWORD=vitriolic
healthcheck_cmd = pg_isready -U vitriolic
healthcheck_interval = 5
healthcheck_timeout = 2
healthcheck_retries = 5

[docker:redis]
image = redis:7-alpine
healthcheck_cmd = redis-cli ping
healthcheck_interval = 5
healthcheck_timeout = 2
healthcheck_retries = 5
