[project]
name = "vitriolic"
urls = { "Source Code" = "https://github.com/goodtune/vitriolic" }
description = "A suite of packages for the Django framework to provide integrated Content Management and Sports Administration functionality for sporting associations."
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    { "name" = "Gary Reynolds", "email" = "gary@touch.asn.au" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "django-guardian>=2.4",
    "django-modelforms>=1.0",
    "django-mptt",
    "django-timezone-field",
    "django>=5.2",
    "first",
    "mcp>=2,<3",
    "namedentities",
    "psycopg",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "ruff>=0.12.8",
]
test = [
    "babel==2.17.0",
    "coverage",
    "django-environ",
    "django-test-plus",
    "factory_boy",
    "fakeredis>=2.39",
    "freezegun",
    "mcp",
    "packaging>=25.0",
    "playwright",
    "pytest-asyncio",
    "pytest-django",
    "pytest-playwright",
    "pytest",
    "requests",
    "tblib",
    "uvicorn>=0.30",
    "whitenoise>=6.9.0",
]

[project.optional-dependencies]
admin = ["django-bootstrap3", "django-gravatar2"]
common = []
content = []
news = [
    "django-imagekit",
    "python-dateutil",
    "python-magic",
]
competition = [
    "pydantic>=2.0",
    "celery>5",
    "cloudinary",
    "django-embed-video",
    "django-filter",
    "django-formtools",
    "django-htmx>=1.23.2",
    "django-mathfilters",
    "django-oauth-toolkit>=3.4",
    "djangorestframework>3.11",
    "drf-nested-routers",
    "google-api-python-client",
    "google-auth-oauthlib",
    "icalendar",
    "internationaltouch-oauth2client",
    "markdown",
    "pyparsing",
    "python-dateutil",
    "python-magic",
    "requests",
]
ops = [
    "datastar-py>=1.0.3",
    "redis>=5",
]
# Deprecated optional dependencies
redis = []

[build-system]
requires = ["setuptools", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["touchtechnology*", "tournamentcontrol*"]

[tool.setuptools_scm]

[tool.isort]
combine_as_imports = true
default_section = "THIRDPARTY"
include_trailing_comma = true
multi_line_output = 5

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.uv]
prerelease = "if-necessary-or-explicit"
