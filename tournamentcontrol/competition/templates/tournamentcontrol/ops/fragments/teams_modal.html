<div id="modal-body" class="sheet">
	<div class="sheet-h"><h3>{{ division.title }}</h3><span class="sub">tap a team for its tournament so far</span><button class="x" type="button" data-on:click="$modal = false">Close</button></div>
	<div class="sheet-b">
		{% for pool, teams in pools.items %}
			{% if pool %}<h4>{{ pool }}</h4>{% endif %}
			<div class="grid">
				{% for team in teams %}
					<div class="tile{% if team.pk in on_field %} onfield{% endif %}" data-on:click="@get('{% url 'ops:booth-team' competition=season.competition.slug season=season.slug ground=ground.slug team_pk=team.pk %}')"><b>{{ team.title }}</b>{% if team.pk in on_field %}<span>on this field now</span>{% endif %}</div>
				{% endfor %}
			</div>
		{% endfor %}
	</div>
</div>
