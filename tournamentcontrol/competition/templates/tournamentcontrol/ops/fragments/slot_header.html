<div id="slot-{{ slot.key }}-h" class="slot-h" data-class:shut="!$slot_{{ slot.key }}" data-on:click="$slot_{{ slot.key }} = !$slot_{{ slot.key }}">
	<span class="car"></span>
	<span class="t">{{ slot.label }}</span>
	<span class="when">{{ slot.entered }} of {{ slot.total }} entered</span>
	<span class="state {{ slot.state }}">{{ slot.state|cut:"_"|title }}</span>
</div>
