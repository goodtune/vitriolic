<div id="slot-{{ slot.key }}-h" class="slot-h" data-on:click="$slot_{{ slot.key }} = !$slot_{{ slot.key }}">
	<span class="car" data-text="$slot_{{ slot.key }} ? '▼' : '▶'">▼</span>
	{{ slot.label }}
	<span class="when">{{ slot.entered }} of {{ slot.total }} entered</span>
	<span class="state {{ slot.state }}">{{ slot.state|cut:"_"|title }}</span>
</div>
