{% extends "tournamentcontrol/competition/compops/base.html" %}
{% block body %}
<main class="index">
	<h1>Tournament Ops</h1>
	{% if seasons %}
		<ul class="seasons">
			{% for season in seasons %}
				<li><a href="{% url 'compops:season' competition=season.competition.slug season=season.slug %}">{{ season }}</a></li>
			{% endfor %}
		</ul>
	{% else %}
		<p class="empty">No season has matches today.</p>
	{% endif %}
</main>
{% endblock %}
