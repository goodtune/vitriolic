{% extends "touchtechnology/admin/edit.html" %}
{% load i18n admin %}

{% block object-actions %}
	{% if object.pk %}
		<a class="button quiet" href="{% url 'admin:fixja:club:person:merge' object.club_id object.pk %}">{% icon "merge" %}<span>{% trans "Merge" %}</span></a>
		<a class="button quiet" href="{% url 'admin:fixja:club:person:transfer' object.club_id object.pk %}">{% icon "transfer" %}<span>{% trans "Transfer" %}</span></a>
	{% endif %}
	{{ block.super }}
{% endblock %}
