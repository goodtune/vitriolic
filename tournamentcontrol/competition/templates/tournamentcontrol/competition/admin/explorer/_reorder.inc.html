{% load i18n admin admin_explorer %}
<form method="post" action="{{ up_url }}">{% csrf_token %}<button type="submit" class="button quiet icon-only compact" title="{% trans "Move up" %}">{% icon "arrow-up" %}<span class="visually-hidden">{% blocktrans %}Move {{ obj }} up{% endblocktrans %}</span></button></form>
<form method="post" action="{{ down_url }}">{% csrf_token %}<button type="submit" class="button quiet icon-only compact" title="{% trans "Move down" %}">{% icon "arrow-down" %}<span class="visually-hidden">{% blocktrans %}Move {{ obj }} down{% endblocktrans %}</span></button></form>
