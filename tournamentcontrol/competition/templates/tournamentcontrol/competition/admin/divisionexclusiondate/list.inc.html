{% extends "mvp/list.inc.html" %}
{% load i18n %}

{% block table-headings %}<th scope="col">{% trans "Date" %}</th>{% endblock %}

{% block table-columns %}
	<td class="mono">
		{% if change_perm in object_perms %}
			<a href="{{ obj.urls.edit }}">{{ obj.date|date:"D j M Y" }}</a>
		{% else %}
			<span>{% block delete-data-title %}{{ obj.date }}{% endblock %}</span>
		{% endif %}
	</td>
{% endblock %}
