{% load i18n console %}
{% comment %}
	Ask how many records to add, then open the bulk create view at ``url`` with
	that many rows (at most 50, BULK_CREATE_MAX in forms.py). Its opener is a
	link to the view with five rows, so it works without scripts too:
	<a href="{{ url }}?count=5" data-bulk="bulk-{{ name }}">…</a>
{% endcomment %}
<dialog class="dialog" id="bulk-{{ name }}" aria-labelledby="bulk-{{ name }}-title" data-bulk-dialog data-url="{{ url }}">
	<div class="dialog__body">
		<h2 class="dialog__title" id="bulk-{{ name }}-title">{{ title }}</h2>
		<div class="field">
			<label class="field__label" for="bulk-{{ name }}-count">{% trans "How many do you want to add?" %}</label>
			<div class="field__control"><input type="number" id="bulk-{{ name }}-count" min="1" max="50" value="5" data-bulk-count></div>
		</div>
		<div class="dialog__actions">
			<button type="button" class="btn" data-dialog-close>{% trans "Cancel" %}</button>
			<button type="button" class="btn btn--primary" data-bulk-go>{% trans "Continue" %}</button>
		</div>
	</div>
</dialog>
