{% extends "touchtechnology/admin/base.html" %}
{% load i18n %}

{% block breadcrumbs %}
	{% if root %}
		{% for n in root.get_ancestors %}
			<li><a href="{% url 'admin:content:index' %}?r={{ n.pk }}"><span class="trail__label">{{ n.title }}</span></a></li>
		{% endfor %}
	{% endif %}
{% endblock %}
