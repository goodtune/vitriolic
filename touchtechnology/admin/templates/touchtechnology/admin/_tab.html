{% comment %}
	One tab of an edit page: give it ``name`` (the tab is "<name>-tab", the
	pane it shows "<name>-pane"), ``label``, and optionally ``count`` and
	``selected``. An address ending "#<name>-tab" opens the page on it.
{% endcomment %}<a class="wb-tab" role="tab" id="{{ name }}-tab" href="#{{ name }}-pane" aria-controls="{{ name }}-pane" aria-selected="{% if selected %}true{% else %}false{% endif %}"{% if count != None and count != "" %} aria-label="{{ label }}"{% endif %}>{{ label }}{% if count != None and count != "" %} <span class="wb-tab-count" aria-hidden="true">{{ count }}</span>{% endif %}</a>
