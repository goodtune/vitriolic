# Prose linting for the project's Markdown. Run it with `tox -e vale`.
# See docs/style.md for what the rules are and why.
StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Vitriolic
Packages = Google

[*.md]
BasedOnStyles = Vale, Google, Vitriolic

# The project writes Australian English: no Oxford comma, punctuation outside
# quotation marks, and day-month-year dates.
Google.Spelling = NO
Google.OxfordComma = NO
Google.Quotes = NO
Google.DateFormat = NO
Google.Ordinal = NO
Google.Units = NO

# Google's word lists are for Google's products: they turn "admin" into
# "administrator" and "application" into "app", which are Django's words.
Google.WordList = NO
Google.WordListCase = NO

# A capital after a colon is fine for a list item that is a full sentence.
Google.Colons = NO

# Rules that report but do not fail: the README and ISSUES are written in the
# author's own voice, and the public MCP guide quotes questions in the first person.
Google.We = suggestion
Google.FirstPerson = suggestion
Google.Will = warning

# Headings are in sentence case everywhere; a heading that breaks it fails.
Google.Headings = error
Google.Ellipses = error

# The prompt the competition app sends to a model: a change in its wording is a
# change in behaviour, so it is reviewed as code, not as prose.
[tournamentcontrol/competition/ai/*.md]
BasedOnStyles =
